<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order/Shop - Affordable Soviet Kicks</title>
</head>

<body>

    <header>
        <h1>Affordable Soviet Kicks</h1>
        <p>Affordable and stylish Soviet sneakers for everyone.</p>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="products.html">Products</a>
            <a href="contact.html">Contact</a>
            <a href="order.html">Order/Shop</a>
        </nav>
    </header>

    <main>
        <h2>Order Your Sneakers</h2>

        <p>Choose your favourite Soviet Kicks sneakers and place your order below.</p>

        <form>
            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name"><br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email"><br><br>

            <label for="product">Choose a Product:</label><br>
            <select id="product" name="product">
                <option value="classic">Soviet Kicks Classic - R250</option>
                <option value="sport">Soviet Kicks Sport - R250</option>
                <option value="casual">Soviet Kicks Casual - R300</option>
            </select><br><br>

            <label for="size">Choose Your Size:</label><br>
            <select id="size" name="size">
                <option value="3">Size 3</option>
                <option value="4">Size 4</option>
                <option value="5">Size 5</option>
                <option value="6">Size 6</option>
                <option value="7">Size 7</option>
                <option value="8">Size 8</option>
                <option value="9">Size 9</option>
                <option value="10">Size 10</option>
            </select><br><br>

            <label for="quantity">Quantity:</label><br>
            <input type="number" id="quantity" name="quantity" min="1" value="1"><br><br>

            <label for="address">Delivery Address:</label><br>
            <textarea id="address" name="address" rows="4" cols="30"></textarea><br><br>

            <button type="submit">Place Order</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Affordable Soviet Kicks. All rights reserved.</p>
    </footer>

</body>
</html>
